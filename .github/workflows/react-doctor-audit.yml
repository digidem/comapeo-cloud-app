name: React Doctor Weekly Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/react-doctor-audit.yml'
      - 'scripts/react-doctor-audit.ts'
      - 'tests/unit/scripts/react-doctor-audit.test.ts'

concurrency:
  group: react-doctor-weekly-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Run full React Doctor audit
        run: >-
          npx --yes react-doctor@0.9.11 .
          --json
          --json-compact
          --json-out react-doctor-report.json
          --scope full
          --blocking none
          --no-score
          --max-duration 120

      - name: Validate reconciliation plan without GitHub writes
        run: npx --yes tsx@4.23.11 scripts/react-doctor-audit.ts react-doctor-report.json --dry-run

  reconcile:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Run full React Doctor audit
        run: >-
          npx --yes react-doctor@0.9.11 .
          --json
          --json-compact
          --json-out react-doctor-report.json
          --scope full
          --blocking none
          --no-score
          --max-duration 120

      - name: Reconcile GitHub issues
        run: npx --yes tsx@4.23.11 scripts/react-doctor-audit.ts react-doctor-report.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-doctor-report
          path: react-doctor-report.json
          if-no-files-found: ignore
          retention-days: 14

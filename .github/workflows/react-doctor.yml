name: React Doctor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: React Doctor
        uses: millionco/react-doctor@v2
        with:
          blocking: none
          scope: changed
